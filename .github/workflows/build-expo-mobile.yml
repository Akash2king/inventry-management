name: Build Expo (Android APK + iOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "waste_oil_expo_app/**"
      - ".github/workflows/build-expo-mobile.yml"

concurrency:
  group: build-expo-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waste_oil_expo_app

    env:
      # Default backend URL baked into the build (override with repo variable EXPO_PUBLIC_API_BASE_URL)
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'http://192.168.29.105:8000/api/v1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: waste_oil_expo_app/package-lock.json

      - name: Install deps (npm ci)
        run: npm ci

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Build APK (EAS, preview)
        run: eas build --platform android --profile preview --non-interactive

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: waste_oil_expo_app

    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'http://192.168.29.105:8000/api/v1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: waste_oil_expo_app/package-lock.json

      - name: Install deps (npm ci)
        run: npm ci

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Build iOS (EAS)
        run: eas build --platform ios --profile preview --non-interactive

