# Build Expo Android APK (native release via prebuild + Gradle)

name: Build Expo Android APK (Release)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-expo-android-apk-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waste_oil_expo_app

    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://inventry-management-1.onrender.com/api/v1' }}
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps (npm ci)
        run: npm ci

      - name: Generate native Android project (expo prebuild)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/ci-generate-native-android.sh

      - name: Patch Gradle for CI release signing
        run: bash scripts/ci-patch-android-signing.sh

      - name: Write Android keystore + signing props
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p android/app
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.jks
          printf '%s\n' \
            "storeFile=release.jks" \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            > android/keystore.properties
          echo "Wrote android/keystore.properties + release.jks"

      - name: Build release APK (Gradle)
        run: |
          set -euo pipefail
          source scripts/android-env.sh
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -x lint --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/

      - name: Normalize APK name
        id: apk
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-manual}"
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          DEST="android/app/build/outputs/apk/release/Chem-Solv-Inventory-${TAG}.apk"
          test -f "$SRC"
          cp -f "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chem-Solv-Inventory-${{ github.ref_name }}-apk
          path: waste_oil_expo_app/${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: waste_oil_expo_app/${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
