name: Build Tauri (Android APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "waste_oil_desktop-TAURI/**"
      - ".github/workflows/build-tauri-android.yml"

concurrency:
  group: build-tauri-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waste_oil_desktop-TAURI

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://192.168.29.105:8000/api/v1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: waste_oil_desktop-TAURI/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run frontend:build

      # NOTE:
      # This project already includes generated Android Gradle project at src-tauri/gen/android.
      # We build that APK directly. (If you migrate to `cargo tauri android build`, we can switch later.)
      - name: Build Android APK (Gradle)
        run: |
          cd src-tauri/gen/android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-apk
          path: waste_oil_desktop-TAURI/src-tauri/gen/android/app/build/outputs/apk/release/*.apk

