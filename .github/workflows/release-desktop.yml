# Legacy: desktop-only nightly on main. Prefer release-clients.yml for versioned releases (v*).

name: Release desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "waste_oil_desktop-TAURI/**"
      - ".github/workflows/release-desktop.yml"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        working-directory: waste_oil_desktop-TAURI

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://inventry-management-1.onrender.com/api/v1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: waste_oil_desktop-TAURI/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build app and create GitHub Release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: waste_oil_desktop-TAURI
          tagName: desktop-build-${{ github.run_number }}
          releaseName: "Chem-Solv Inventory — Windows build ${{ github.run_number }}"
          releaseBody: |
            Automated desktop build from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on `${{ github.ref_name }}`.

            Download the **NSIS `.exe` installer** from the assets below.

            API URL baked in: `${{ env.VITE_API_BASE_URL }}` (override with Actions variable `VITE_API_BASE_URL`).

            For a combined desktop + Android release, push a `v*` tag (see `release-clients.yml`).
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
